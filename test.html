<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка отправки промокода</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#fcecc8;color:#2b2b2b}
input,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:2px solid #2b2b2b;border-radius:0;background:#fff}
button{background:#f7a8b8;font-weight:700}
pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:2px solid #2b2b2b;padding:12px;min-height:80px}
</style></head><body>
<h3>Проверка отправки промокода в бот</h3>
<p>Нажмите кнопку: в бота уйдёт тестовый код. Если сообщение пришло, всё работает.</p>
<input id="u" value="https://vinisugargame.vercel.app/api/promo">
<button id="b">Отправить тестовый код</button>
<pre id="o">Здесь появится результат.</pre>
<script>
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function hsh(s){let h=2166136261;for(const c of s+'vini-sugar-10'){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function promo(){const a=new Uint8Array(6);crypto.getRandomValues(a);let r='';for(let i=0;i<6;i++)r+=AL[a[i]%32];const h=hsh(r);return 'VINI-'+r.slice(0,3)+'-'+r.slice(3)+'-'+AL[h%32]+AL[(h>>>5)%32]}
const o=document.getElementById('o');
document.getElementById('b').onclick=async()=>{
 const url=document.getElementById('u').value.trim(),code=promo();
 o.textContent='Отправляю '+code+' на\n'+url+' ...';
 const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
 try{
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code}),signal:c.signal});
  const txt=await r.text();
  o.textContent='Ответ сервера: '+r.status+'\n'+txt.slice(0,300)+'\n\nКод: '+code;
 }catch(e){
  o.textContent='Не удалось связаться с сервером.\n'+(e.name==='AbortError'?'Время ожидания вышло (15 с).':e.name+': '+e.message)+'\n\nКод: '+code;
 }finally{clearTimeout(t)}
};
</script></body></html>
