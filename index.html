function drawBees() {
    if (!L.bees) { manageBuzz(false); return; }
    let anyNerv = false;
    for(let i=0; i<6; i++) {
        const dir = i % 2 === 0 ? 1 : -1;
        const moveProg = t * 0.6 + Math.sin(t * 0.06 + i * 11) * 12; // Чуть медленнее
        let bx = (i * 350 + moveProg * dir) % (L.w + 300);
        if (bx < 0) bx += L.w + 300;
        bx -= 100;
        if (bx > cam - 40 && bx < cam + W + 40) {
            const by = 25 + (i*25)%70 + Math.sin(t*0.05 + i)*15 + Math.sin(t*0.4 + i)*3;
            x.fillStyle='#2b2b2b'; x.fillRect(Math.round(bx), Math.round(by), 3, 2);
            x.fillStyle='#fff'; x.fillRect(Math.round(bx), Math.round(by)-1, 1, 1); x.fillRect(Math.round(bx)+2, Math.round(by)-1, 1, 1);
            x.fillStyle='#f2b630'; x.fillRect(Math.round(bx)+1, Math.round(by), 1, 2);
        }
    }
    const k0 = Math.floor(cam / 120);
    const k1 = Math.ceil((cam + W) / 120);
    if (!window.Swarms) window.Swarms = {};
    for (let k = k0; k <= k1; k++) {
        const hs = bhash(k * 7777 + 3);
        if (hs % 100 < 50) continue;
        const basex = k * 120 + (hs % 60);
        const basey = 35 + ((hs >>> 6) % 25);
        let sw = window.Swarms[k];
        if (!sw) sw = window.Swarms[k] = { bx: basex, by: basey, tx: basex, ty: basey, vx: 0, vy: 0, alert: 0 };
        if (sw.vx === undefined) { sw.vx = 0; sw.vy = 0; sw.alert = 0; }

        const curDx = sw.bx - (p.x+5);
        const curDy = sw.by - (p.y+7);
        const dist = Math.hypot(curDx, curDy * 0.8); // вертикаль весит чуть меньше: важнее подход по горизонтали

        // Рой пугается заранее (примерно за два корпуса героя), чтобы игрок не пытался его обходить, и целиком улетает в сторону
        if (dist < SCARE_D && sw.alert === 0) {
            sw.alert = 140;
            let ang = Math.random() * Math.PI * 2, dx = Math.cos(ang), dy = Math.sin(ang) * 0.6;
            const nx = curDx / (dist || 1), ny = curDy / (dist || 1);
            for (let tries = 0; tries < 8 && dx * nx + dy * ny < -0.3; tries++) {
                ang = Math.random() * Math.PI * 2; dx = Math.cos(ang); dy = Math.sin(ang) * 0.6;
            }
            sw.tx = Math.max(basex - 220, Math.min(basex + 220, sw.bx + dx * (70 + Math.random() * 40)));
            sw.ty = Math.max(16, Math.min(62, sw.by + dy * (50 + Math.random() * 25)));
        } else if (sw.alert > 0) {
            sw.alert--;
        } else if (dist > SCARE_D + 30) {
            sw.tx = basex; sw.ty = basey; // успокоился и неспешно возвращается на место
        }
        const kSp = sw.alert > 0 ? 0.02 : 0.008, damp = sw.alert > 0 ? 0.9 : 0.92;
        sw.vx = (sw.vx + (sw.tx - sw.bx) * kSp) * damp;
        sw.vy = (sw.vy + (sw.ty - sw.by) * kSp) * damp;
        const spd = Math.hypot(sw.vx, sw.vy), vmax = sw.alert > 0 ? 1.3 : 0.5;
        if (spd > vmax) { sw.vx *= vmax / spd; sw.vy *= vmax / spd; }
        sw.bx += sw.vx;
        sw.by += sw.vy;

        const nerv = sw.alert > 0 && Math.hypot(sw.vx, sw.vy) > 0.35;
        if(nerv) anyNerv = true;
        const numBees = 4 + (hs % 4);
        for (let i = 0; i < numBees; i++) {
            const b_hs = bhash(hs + i * 13);
            let ox = Math.sin(t / (nerv ? 3 : 8 + (b_hs % 5)) + i) * (nerv ? 4 : 6);
            let oy = Math.cos(t / (nerv ? 4 : 10 + (b_hs % 6)) + i) * (nerv ? 4 : 6);
            // хвост роя тянется за движением, как у настоящих пчёл
            ox -= sw.vx * (i % 4) * 2.2;
            oy -= sw.vy * (i % 4) * 2.2;
            const bx = sw.bx + ox;
            const by = sw.by + oy;
            const ph = (t+(b_hs%10))%6;
            x.fillStyle = (ph<3) ? '#2b2b2b' : '#f2b630';
            x.fillRect(Math.round(bx), Math.round(by), 2, 1);
            if(ph<3) { x.fillStyle='#fff'; x.fillRect(Math.round(bx), Math.round(by)-1, 1, 1); }
        }
    }
    manageBuzz(anyNerv);
}

                    }

            }
        }
    }
    if (window.BF) {
        for (let i = window.BF.length - 1; i >= 0; i--) {
            let bf = window.BF[i];
            bf.x += bf.vx;
            bf.y += bf.vy;
            bf.vx += (Math.random() - 0.5) * 0.3; // Менее резкий хаос

            dbf(Math.round(bf.x), Math.round(bf.y), bf.hs);

                window.BF.splice(i, 1);
            }
        }
    }

// Компьютер: Telegram Desktop/Web или устройство с мышью
function isDesk(){const t=tgw();if(t&&t.platform)return /^(tdesktop|macos|weba|webk|web|unigram)/.test(t.platform);return matchMedia('(hover:hover) and (pointer:fine)').matches}
// На всех устройствах первые 3,5 с игру запустить нельзя: можно рассмотреть заставку и прочитать надписи
// (на компьютере за это время ещё подключается Telegram), потом появляется мигающее «Нажми на экран»
let startLock=true;
$('gostart').style.visibility='hidden';
setTimeout(()=>{startLock=false;$('gostart').style.visibility=''},3500);
// На компьютере полный экран включается по первому нажатию (мышь или клавиша) и повторяется, пока не получится.
// Если игрок сам вышел из полного экрана, больше не включаем.
let fsDone=false,seenFull=false,fsTries=0;
function inTg(){try{return /tgWebApp/.test(location.hash)||!!sessionStorage.getItem('__vsTg')||!!window.TelegramWebviewProxy}catch(e){return false}}
function tryFs(){if(fsDone||startLock||!isDesk())return;if(inTg()&&!tgFull()&&!isFull())return;
 if(isFull()){seenFull=true;return}
 if(seenFull||++fsTries>20){fsDone=true;return}
 try{const t=tgFull();if(t)t.requestFullscreen();else{const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq){const r=rq.call(el);if(r&&r.catch)r.catch(()=>{})}}}catch(e){}}
['pointerdown','pointerup','click','keydown'].forEach(ev=>addEventListener(ev,tryFs,true));
// Нажатие вне игрового поля (по полям вокруг) тоже запускает игру на экранах заставки/паузы
addEventListener('pointerdown',e=>{if((e.target===document.body||e.target===document.documentElement)&&st!=='play')act()});
addEventListener('resize',fit);setInterval(fit,700);fit();
function fitBurst(){fit();[60,200,450,900,1600].forEach(d=>setTimeout(fit,d))}
addEventListener('orientationchange',fitBurst);
if(window.visualViewport)visualViewport.addEventListener('resize',fitBurst);
function tgw(){const t=window.Telegram&&Telegram.WebApp;return(t&&t.platform&&t.platform!=='unknown')?t:null}
function tgFull(){const t=tgw();return(t&&t.isVersionAtLeast&&t.isVersionAtLeast('8.0')&&t.requestFullscreen)?t:null}

function isFull(){const t=tgFull();return (t&&t.isFullscreen)||!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement)}

function goFull(on){try{
 const t=tgFull();
 const el=document.documentElement;
 if(on){
  if(t)t.requestFullscreen();
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req)req.call(el).catch(()=>{});
 }else{
  if(t)t.exitFullscreen();
  const ext=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
  if(ext)ext.call(document).catch(()=>{});
 }
}catch(e){}}

function updFs(){}
const lm=matchMedia('(orientation: landscape)');
function rot(){const t=tgFull();if(!t||!/^(android|ios)/.test(t.platform))return;
 if(lm.matches&&!t.isFullscreen)goFull(true);else if(!lm.matches&&t.isFullscreen)goFull(false)}
function tgReady(){updFs();rot();try{['viewportChanged','safeAreaChanged','contentSafeAreaChanged','fullscreenChanged'].forEach(e=>Telegram.WebApp.onEvent(e,fitBurst));Telegram.WebApp.onEvent('deactivated',()=>setPaused(true));Telegram.WebApp.onEvent('activated',()=>setPaused(false))}catch(e){}fit()}
if(lm.addEventListener)lm.addEventListener('change',rot);else lm.addListener(rot);



tgReady();
// ---- запасной мост к Telegram: работает, если telegram.org недоступен и скрипт не загрузился ----
let tgFBdone=false;
function tgFB(){
 if(tgFBdone||(window.Telegram&&Telegram.WebApp))return;
 let hp={};try{const q=new URLSearchParams(location.hash.slice(1));q.forEach((v,k)=>hp[k]=v);
  if(hp.tgWebAppPlatform)sessionStorage.setItem('__vsTg',JSON.stringify(hp));else{const sv=sessionStorage.getItem('__vsTg');if(sv)hp=JSON.parse(sv)}}catch(e){}
 const proxy=!!window.TelegramWebviewProxy,framed=(()=>{try{return window.parent!==window}catch(e){return true}})();
 if(!hp.tgWebAppPlatform&&!proxy)return;
 tgFBdone=true;
 const ver=hp.tgWebAppVersion||'8.0',cbs={},css=(n,v)=>document.documentElement.style.setProperty(n,(+v||0)+'px');
 const cmp=(a,b)=>{a=String(a).split('.');b=String(b).split('.');for(let i=0;i<4;i++){const x=+a[i]||0,y=+b[i]||0;if(x!==y)return x>y?1:-1}return 0};
 const post=(ev,d)=>{const data=d===undefined?'':d;try{if(proxy)TelegramWebviewProxy.postEvent(ev,JSON.stringify(data));else if(framed)parent.postMessage(JSON.stringify({eventType:ev,eventData:data}),'*')}catch(e){}};
 const fire=n=>(cbs[n]||[]).forEach(f=>{try{f()}catch(e){}});
 const WA={platform:hp.tgWebAppPlatform||'android',version:ver,isFullscreen:false,
  isVersionAtLeast:v=>cmp(ver,v)>=0,ready(){post('web_app_ready')},expand(){post('web_app_expand')},
  requestFullscreen(){post('web_app_request_fullscreen')},exitFullscreen(){post('web_app_exit_fullscreen')},
  onEvent(n,f){(cbs[n]=cbs[n]||[]).push(f)},offEvent(){},openTelegramLink(u){try{const a=document.createElement('a');a.href=u;post('web_app_open_tg_link',{path_full:a.pathname+a.search})}catch(e){}}};
 const recv=(ev,d)=>{d=d||{};
  if(ev==='fullscreen_changed'){WA.isFullscreen=!!d.is_fullscreen;fire('fullscreenChanged')}
  else if(ev==='safe_area_changed'){['top','bottom','left','right'].forEach(k=>css('--tg-safe-area-inset-'+k,d[k]));fire('safeAreaChanged')}
  else if(ev==='content_safe_area_changed'){['top','bottom','left','right'].forEach(k=>css('--tg-content-safe-area-inset-'+k,d[k]));fire('contentSafeAreaChanged')}
  else if(ev==='viewport_changed')fire('viewportChanged');
  else if(ev==='visibility_changed')fire(d.is_visible?'activated':'deactivated')};
 window.Telegram=window.Telegram||{};
 Telegram.WebView=Telegram.WebView||{};Telegram.WebView.receiveEvent=recv;Telegram.WebApp=WA;
 window.TelegramGameProxy_receiveEvent=recv;
 if(framed)addEventListener('message',e=>{try{const m=JSON.parse(e.data);recv(m.eventType,m.eventData)}catch(x){}});
 WA.ready();WA.expand();
 if(cmp(ver,'8.0')>=0){post('web_app_request_safe_area');post('web_app_request_content_safe_area')}
 tgReady();
}
tgFB(); // мост поднимаем сразу, не дожидаясь telegram.org (настоящий скрипт при загрузке его заменит)
setTimeout(tgFB,2500);setTimeout(tgFB,6000);
document.body.addEventListener('click',mInit);document.body.addEventListener('touchend',mInit);


</script></body></html>
