<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1f1f1f}}
:root[data-theme="dark"]{--page:#1f1f1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--page)}
body{display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Press Start 2P',ui-monospace,monospace}
#g{position:relative;container-type:inline-size;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;background:var(--cream);color:var(--ink)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqw;background:var(--cream);text-align:center;cursor:pointer;font-size:1.9cqw;line-height:1.6;padding:2cqw}
.scr[hidden]{display:none}


.scr h2{margin:0;font-size:2.8cqw;font-weight:400}
.hint{font-size:1.4cqw;opacity:.7}

#pc{display:flex;flex-direction:column;align-items:center;gap:1cqw;background:#fff;border:.5cqw solid var(--ink);box-shadow:.7cqw .7cqw 0 var(--ink);padding:1.4cqw 2cqw;font-size:1.5cqw;cursor:default}
#pc[hidden]{display:none}
#pc b{font-size:3cqw;font-weight:400;user-select:all;-webkit-user-select:all;cursor:text}
#pc button{font:inherit;font-size:1.4cqw;color:var(--ink);cursor:pointer;border:.4cqw solid var(--ink);background:var(--pink);padding:.8cqw 1.4cqw;border-radius:0;box-shadow:0 .5cqw 0 var(--ink)}
#pc button:active{transform:translateY(.5cqw);box-shadow:none}
#splash{background:transparent}

#splash .go{background:#fff;border:.5cqw solid var(--ink);padding:1.2cqw 2.2cqw;box-shadow:.7cqw .7cqw 0 var(--ink);font-size:2cqw;animation:blink 1.1s steps(2) 1.3s infinite both}
@keyframes in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-1.2cqw)}}
@keyframes blink{0%{opacity:0}50%{opacity:1}}
#tc{position:absolute;inset:auto 2cqw 5cqw 2cqw;display:none;justify-content:space-between;pointer-events:none}
#g[data-st="play"] #tc{display:flex}
#tc div{display:flex;gap:2cqw}
#tc button{pointer-events:auto;position:relative;width:clamp(44px,9cqw,92px);aspect-ratio:1;padding:0;background:#fff;opacity:.85;border:.45cqw solid var(--ink);border-radius:0;box-shadow:0 .7cqw 0 var(--ink);cursor:pointer;touch-action:none;transition:transform .08s,box-shadow .08s,background .15s,opacity .15s}
#tc button::before{content:"";position:absolute;inset:24%;background:var(--ink);clip-path:var(--ar)}
#bl{--ar:polygon(50% 0,50% 25%,100% 25%,100% 75%,50% 75%,50% 100%,0 50%)}
#br{--ar:polygon(50% 0,100% 50%,50% 100%,50% 75%,0 75%,0 25%,50% 25%)}
#bj{--ar:polygon(50% 0,100% 50%,75% 50%,75% 100%,25% 100%,25% 50%,0 50%)}
#tc button{outline:none;-webkit-tap-highlight-color:transparent}

/* Панель верхних кнопок (музыка и фулскрин) */
.top-btns{position:absolute;top:1.4cqw;left:50%;transform:translateX(-50%);display:flex;gap:10cqw;z-index:10;pointer-events:auto;}
#g:not([data-st="play"]) .top-btns{display:none}

.top-btn{width:clamp(24px, 4.2cqw, 40px);height:clamp(24px, 4.2cqw, 40px);padding:0;background:#fff;border:.4cqw solid var(--ink);border-radius:0;box-shadow:0 .5cqw 0 var(--ink);cursor:pointer;touch-action:none;transition:transform .08s,box-shadow .08s,background .15s,opacity .15s;font:inherit;font-size:2cqw;font-weight:900;color:var(--ink);display:flex;align-items:center;justify-content:center;outline:none;-webkit-tap-highlight-color:transparent;}
.top-btn:active{transform:translateY(.5cqw);box-shadow:0 0 0 var(--ink);}
#mu.off{background:var(--pink);text-decoration:line-through;}
#mu{font-size:2.6cqw;-webkit-text-stroke:.1cqw var(--ink);padding:0;}
#tc button.on{background:#ffd84a;opacity:1;transform:translateY(.7cqw);box-shadow:0 0 0 var(--ink)}
@media (prefers-reduced-motion:reduce){#splash img,#splash .go{animation:none}}

.logo-box{aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.logo-box img{width:100%;height:100%;object-fit:cover;transform:scale(1.4) translateY(-8%);}
#splash .logo-box{background:var(--cream);border:.8cqw solid var(--ink);box-shadow:1.2cqw 1.2cqw 0 var(--ink);height:55%;animation:in 1s ease-out both,fl 3s ease-in-out 1s infinite;}
.scr.sm .logo-box{height:40%;}
#win.pcv .logo-box{height:25%;}

function mtick(){if(!ac||!mg||ac.state!=='running'||muted)return;const T=TR[cur%TR.length],sd=60/T.b/2;if(mnext<ac.currentTime)mnext=ac.currentTime+.05;
 while(mnext<ac.currentTime+.2){const i=mstep%T.m.length,c=T.m[i];if(c!=='.')note(nt(T,+c),mnext,sd*.9,T.w,T.w==='square'?.05:.08);
  if(i%4===0){const b=T.bs[(i/4)%T.bs.length];if(b!=='.')note(nt(T,+b,-24),mnext,sd*3.6,'triangle',.1)}mnext+=sd;mstep++}}
mInit();setInterval(mtick,60);
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,mInit,true));
function show(id){['splash','over','win'].forEach(s=>$(s).hidden=s!==id)}
function setSt(s){st=s;g.dataset.st=s}
function newGame(){mInit();lv=0;lives=3;tot=0;build();mus(1);show('');setSt('play');beep(440)}
function act(){mInit();if(st==='nxt'){lv++;build();mus(lv+1);show('');setSt('play');beep(440)}else if(st==='over'){lives=3;build();show('');setSt('play');beep(440)}else if(st!=='play')newGame()}
function hurt(fall){lives--;beep(150,.25);if(lives<=0){setSt('over');show('over');return}
 if(fall){p.x=L.G.filter(a=>a[0]<=p.x).pop()[0]+10;p.y=60;p.vy=0}else p.vy=-4;p.inv=90}

function fin(){tot+=score;CNT[lv]=items.length;const last=lv>=LV.length-1;setSt(last?'fin':'nxt');const mx=CNT.reduce((a,b)=>a+b,0),pc=Math.round(tot/mx*100),ok=last&&pc>=90;$('win').classList.toggle('pcv',ok);$('pc').hidden=!ok;
 if(ok){
  const cd=promo();$('pcd').textContent=cd;$('pcb').textContent='Скопировать';
  $('ws').innerHTML = last?'Всего сладостей: '+tot+' из '+mx+' ('+pc+'%)<br><span id="ps" style="font-size: 0.8em; color: #6a6a6a; display: block; margin-top: 1cqw;">Отправка боту...</span>':'';
  if(PROMO_URL){
   fetch(PROMO_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:cd})})
    .then(r => { if(r.ok) $('ps').textContent = '✅ Код отправлен боту'; else throw new Error(); })
    .catch(()=>{ $('ps').textContent = '⚠️ Ошибка связи. Сделайте скриншот кода!'; $('ps').style.color = '#e0556b'; });
  }
 } else {
  $('ws').textContent=last?'Всего сладостей: '+tot+' из '+mx+' ('+pc+'%). Для промокода нужно 90%':'Собрано: '+score+' из '+items.length;
 }
 $('wt').textContent=last?'Все уровни пройдены!':'Уровень '+(lv+1)+' пройден!';
 $('wh').textContent=last?'Нажми, чтобы сыграть ещё раз':'Нажми, чтобы идти дальше';show('win');beep(660,.3)}

const fx=f=>f+Math.sin(t/25)*L.mv;
function upd(){
 const ax=bn>0?0:(K.r?1:0)-(K.l?1:0);p.vx=ax*1.7;if(ax)p.f=ax;
 if(K.j&&p.g&&bn<=0){p.vy=-7.5;p.g=false;beep(520)}
 p.vy=Math.min(p.vy+.45,9);
 p.x=Math.max(0,Math.min(L.w-10,p.x+p.vx));
 const oy=p.y+14,wg=p.g;p.y+=p.vy;p.g=false;
 if(p.vy>=0)for(const q of P)if(p.x+8>q[0]&&p.x+2<q[0]+q[2]&&oy<=q[1]+1&&p.y+14>=q[1]){p.y=q[1]-14;p.vy=0;p.g=true}
 if(!wg&&p.g){p.sq=6;for(let i=0;i<5;i++)pts.push({x:p.x+5,y:p.y+14,vx:(i-2)*.4,vy:-Math.random()*.6,l:14,c:'#fff'})}if(p.sq>0)p.sq--;if(p.inv>0)p.inv--;if(bn>0)bn--;
 if(p.y>H+20)hurt(true);
 for(const it of items)if(it.on&&p.x+8>it.x&&p.x+2<it.x+8&&p.y+14>it.y&&p.y<it.y+8){it.on=0;score++;beep(880,.1);
  for(let i=0;i<6;i++)pts.push({x:it.x+4,y:it.y+4,vx:Math.random()*2-1,vy:-Math.random()*2,l:20})}
 for(const h of hearts)if(h.on&&lives<3&&p.x+8>h.x&&p.x+2<h.x+7&&p.y+14>h.y&&p.y<h.y+7){h.on=0;lives++;beep(990,.15);for(let i=0;i<8;i++)pts.push({x:h.x+3,y:h.y+3,vx:Math.random()*2-1,vy:-Math.random()*2,l:20,c:'#e0556b'})}
 if(!p.inv)for(const f of FLM){const a=fx(f);if(p.x+8>a+1&&p.x+2<a+7&&p.y+14>GY-6&&p.y<GY){hurt(false);break}}
 pts.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.1;a.l--});pts=pts.filter(a=>a.l>0);
 if(p.x>L.w-40)fin();
}
function disc(cx,cy,r,c){x.fillStyle=c;for(let d=-r;d<=r;d++){const w=Math.floor(Math.sqrt(r*r-d*d+.5));x.fillRect(cx-w,cy+d,2*w+1,1)}}
function hill(c,sp,base,amp,per){x.fillStyle=c;for(let a=0;a<W;a++){const h=base+Math.sin((a+cam*sp)/per)*amp+Math.sin((a+cam*sp)/(per*.37))*amp*.3;x.fillRect(a,Math.floor(h),1,H)}}
function bg(){
 const n=L.sky.length;L.sky.forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,Math.floor(i*H/n),W,Math.ceil(H/n)+1)});
 if(L.st)for(let i=0;i<28;i++)if((t+i*7)%60<50){x.fillStyle='#fff';x.fillRect(i*53%W,i*29%64,1,1)}
 disc(L.sun[0],L.sun[1],L.sun[2],L.sun[3]);
 if(L.cl)for(let i=0;i<4;i++){const cx=((i*83-cam*.15)%280+280)%280-40,cy=10+(i%2)*14;x.fillStyle=L.cl;x.fillRect(cx,cy+4,28,6);x.fillRect(cx+4,cy,10,6);x.fillRect(cx+13,cy+1,12,5)}
 hill(L.h1,.2,58,9,38);hill(L.h2,.4,72,7,26);
 for(let i=0;i<4;i++){const px=((i*70-cam*.6)%280+280)%280-40;
  if(L.de==='tree'){x.fillStyle='#8a5a34';x.fillRect(px,GY-14,4,14);disc(px+2,GY-22,9,'#4fbf5a');disc(px-2,GY-18,6,'#4fbf5a');disc(px+6,GY-18,6,'#4fbf5a');disc(px,GY-25,3,'#7fe08a')}
  else if(L.de==='cane'){if(i%2){x.fillStyle='#fff';x.fillRect(px+3,GY-12,2,12);disc(px+4,GY-20,8,'#ff7fae');disc(px+4,GY-20,5,'#fff');disc(px+4,GY-20,2,'#ff7fae')}
   else{for(let r=0;r<24;r+=4){x.fillStyle=r%8?'#e0556b':'#fff';x.fillRect(px,GY-r-4,3,4)}x.fillStyle='#fff';x.fillRect(px,GY-30,8,3);x.fillStyle='#e0556b';x.fillRect(px+6,GY-28,2,5)}}
  else if(L.de==='wheat'){for(let j=0;j<6;j++){const wx=px+j*5,hh=16+(j%3)*4;x.fillStyle='#c58a3a';x.fillRect(wx,GY-hh,1,hh);x.fillStyle='#f2b630';x.fillRect(wx-1,GY-hh-5,3,6);x.fillStyle='#fff3a0';x.fillRect(wx,GY-hh-5,1,2)}}
  else for(let r=0;r<4;r++){const y=GY-34+r*8,w=6+r*8;x.fillStyle=L.pc||'#6b3f26';x.fillRect(px+4-w/2,y,w,8);x.fillStyle='#ff9be0';x.fillRect(px+4-w/2+2,y+3,2,1);x.fillStyle='#8ee6ff';x.fillRect(px+4+w/2-4,y+5,2,1)}}
}
function box(a,b,w,h,f){x.fillStyle=INK;x.fillRect(a-1,b-1,w+2,h+2);x.fillStyle=f;x.fillRect(a,b,w,h)}
function draw(){
 bg();x.save();x.translate(-Math.round(cam),0);
 for(const q of P){const[a,y,w]=q;
  if(y===GY){x.fillStyle=L.gd;x.fillRect(a,y-1,w,1);x.fillStyle=L.gt;x.fillRect(a,y,w,3);x.fillStyle=L.gd;x.fillRect(a,y+3,w,1);x.fillStyle=L.gs;x.fillRect(a,y+4,w,H-y);
   x.fillStyle=L.gd;x.fillRect(a,y,1,H-y);x.fillRect(a+w-1,y,1,H-y);
   x.fillStyle='rgba(0,0,0,.13)';for(let b=a+4;b<a+w-3;b+=12)for(let c=y+8;c<H;c+=8)x.fillRect(b+((c>>3)%2)*6,c,2,2);
   for(let b=a+10;b<a+w-6;b+=22)if(!FLM.some(f=>Math.abs(f-b)<14)){x.fillStyle=L.gd;x.fillRect(b,y-4,1,4);x.fillStyle=L.f[(b/22|0)%3];x.fillRect(b-1,y-6,3,3)}}
  else{x.fillStyle=L.gd;x.fillRect(a,y-1,w,1);x.fillStyle=L.gt;x.fillRect(a,y,w,3);x.fillStyle=L.gs;x.fillRect(a,y+3,w,3);x.fillStyle=L.gd;x.fillRect(a,y+6,w,1);x.fillRect(a,y,1,7);x.fillRect(a+w-1,y,1,7)}}
 const gx=L.w-52;box(gx,GY-12,36,12,'#fff');box(gx+5,GY-22,26,10,L.gc);box(gx+10,GY-30,16,8,'#fff');box(gx+16,GY-37,4,5,C.r);
 for(const f of FLM){const a=Math.round(fx(f));x.save();if(t%20<10){x.translate(a+9,0);x.scale(-1,1);x.drawImage(FL,0,GY-9)}else x.drawImage(FL,a-1,GY-9);x.restore()}
 for(const it of items)if(it.on)x.drawImage(SP[it.t],Math.round(it.x)-1,Math.round(it.y+Math.sin(t/10+it.x)*1.5)-1);
 for(const h of hearts)if(h.on)x.drawImage(HT,Math.round(h.x)-1,Math.round(h.y+Math.sin(t/8+h.x)*2)-1);
 pts.forEach(a=>{x.fillStyle=a.c||C.y;x.fillRect(Math.round(a.x),Math.round(a.y),2,2)});
 if(st!=='splash'&&!(p.inv&&p.inv%8<4)){const fs=pose(),py=Math.round(p.y)-1+pdy;x.save();
  if(p.f<0){x.translate(Math.round(p.x)+11,0);x.scale(-1,1);dg(fs,0,py)}else dg(fs,Math.round(p.x)-1,py);x.restore()}
 x.restore();
 x.font='8px "Press Start 2P",monospace';x.textBaseline='top';
 if(st!=='splash'){const s=score+'/'+items.length,w=Math.ceil(x.measureText(s).width)+22;box(3,3,w,13,'#fff');x.drawImage(SP[L.sw[0]],5,5);x.fillStyle=INK;x.textAlign='left';x.fillText(s,18,6)}
 if(st!=='splash'){box(W-39,3,36,13,'#fff');for(let i=0;i<lives;i++)x.drawImage(HT,W-36+i*11,6)}
 if(bn>0&&st==='play'){box(W/2-80,22,160,28,'#fff');x.fillStyle=INK;x.textAlign='center';x.fillText('Уровень '+(lv+1),W/2,27);x.fillText(L.nm,W/2,39)}
 if(st!=='splash'){const pr=Math.max(0,Math.min(1,p.x/(L.w-40))),bx=14,bw=W-28,by=H-5;box(bx,by,bw,2,'#fff');x.fillStyle=L.gc;x.fillRect(bx,by,Math.round(bw*pr),2);x.drawImage(MN,bx+Math.round(bw*pr)-3,by-2)}
 if(st==='play')cam=Math.max(0,Math.min(L.w-W,p.x-W/2+5));
}
let last=0,acc=0;function loop(ts){acc+=Math.min(ts-last,100);last=ts;while(acc>=16.67){if(st==='play')upd();if(st==='splash')cam=(cam+.35)%(L.w-W);t++;acc-=16.67}draw();requestAnimationFrame(loop)}
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
const BM={l:'bl',r:'br',j:'bj'};addEventListener('keydown',e=>{const m=KM[e.code];if(m){e.preventDefault();K[m]=1;$(BM[m]).classList.add('on')}if((e.code==='Space'||e.code==='Enter')&&st!=='play')act()});
addEventListener('keyup',e=>{const m=KM[e.code];if(m){K[m]=0;$(BM[m]).classList.remove('on')}});
const RBM={bl:'l',br:'r',bj:'j'};
function hT(e){if(e.cancelable)e.preventDefault();['l','r','j'].forEach(k=>K[k]=0);['bl','br','bj'].forEach(id=>$(id).classList.remove('on'));for(let i=0;i<e.touches.length;i++){const el=document.elementFromPoint(e.touches[i].clientX,e.touches[i].clientY);if(el&&RBM[el.id]){K[RBM[el.id]]=1;el.classList.add('on');}}}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>$('tc').addEventListener(ev,hT,{passive:false}));
[['bl','l'],['br','r'],['bj','j']].forEach(([id,m])=>{const b=$(id);b.addEventListener('mousedown',e=>{e.preventDefault();K[m]=1;b.classList.add('on')});['mouseup','mouseleave'].forEach(ev=>b.addEventListener(ev,()=>{K[m]=0;b.classList.remove('on')}))});
['splash','over','win'].forEach(id=>$(id).addEventListener('pointerdown',act));
$('pc').addEventListener('pointerdown',e=>e.stopPropagation());
$('pcb').addEventListener('click',()=>{const c=$('pcd').textContent,sel=()=>{const r=document.createRange();r.selectNodeContents($('pcd'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('pcb').textContent='Выделено — скопируй'};try{navigator.clipboard.writeText(c).then(()=>$('pcb').textContent='Скопировано',sel)}catch(e){sel()}});
$('mu').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();muted=!muted;$('mu').classList.toggle('off',muted);if(mg)mg.gain.value=muted?0:1});
lives=3;tot=0;build();requestAnimationFrame(loop);
$('fs').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})}catch(e){}});
document.body.addEventListener('click',mInit);document.body.addEventListener('touchend',mInit);


</script></body></html>
